<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROWPLUS</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GrowPlus">
    <link rel="apple-touch-icon" href="GrowPlusicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f0fdf4; color: #166534; }
        .hide { display: none !important; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-radius: 1rem; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 4px 10px -1px rgba(0, 0, 0, 0.08); }
        .btn-green { background-color: #10b981; color: white; transition: all 0.2s; }
        .btn-green:hover { background-color: #059669; }
        #view-login { background-image: linear-gradient(rgba(240, 253, 244, 0.25), rgba(6, 95, 70, 0.45)), url('https://i.imgur.com/zX5CkzC.jpg'); background-size: cover; background-position: center; }
        
        //For image slider
        .embedded-slider {
          position: relative;
          width: 100%;          /* Adapts to parent column/container width */
          max-width: 500px;     /* Set maximum width for the slider */
          aspect-ratio: 1 / 1;        /* Adjust height as needed */
          margin: 20px auto;    /* Centers slider inside the section */
          overflow: hidden;
          border-radius: 8px;
        }

      .slider-track {
        display: flex;
        width: 100%;
        height: 100%;
        transition: transform 0.4s ease-in-out;
      }

      .slider-track img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        flex-shrink: 0;
      }

      .slider-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: #ffffff;
        border: none;
        padding: 10px 15px;
        cursor: pointer;
        border-radius: 4px;
        font-size: 18px;
        user-select: none;
        z-index: 2;
      }

      .slider-btn:hover {
        background: rgba(0, 0, 0, 0.8);
      }

      .slider-btn.prev { left: 10px; }
      .slider-btn.next { right: 10px; }

    </style>
</head>
<body>

    <div id="loader" class="hide fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
        <i class="ph-bold ph-spinner-gap animate-spin text-5xl text-emerald-500 mb-4"></i>
        <p class="text-emerald-700 font-medium">Authenticating profile security...</p>
    </div>

    <div id="view-login" class="min-h-screen flex flex-col lg:flex-row items-center justify-center p-4 gap-8">
        
        <!-- LEFT COLUMN: Image Slider & Latest Announcements -->
        <div class="flex flex-col gap-1/2 w-full max-w-md">
            
            <!-- Image Slider -->
            <div class="embedded-slider w-full">
                <div class="slider-track">
                    <img src="https://lh3.googleusercontent.com/d/18p5OHuxVsGs971YODMPHJuka28DM7I7e" alt="Poster Data Detective">
                    <img src="https://lh3.googleusercontent.com/d/1Bm6zcscaPMWRLprTfJ2_y93wKkYDWuAR" alt="Qestion 2000GP">
                    <img src="https://lh3.googleusercontent.com/d/1jYf6sh45XoK8QxdrbxBZP2YeYScXryXd" alt="Collect 2000GP">
                    <img src="https://lh3.googleusercontent.com/d/1odKjrAjhqtvT_mfn_2-xmce4QiJNkXDY" alt="Reopen Weekly Challenge">
                    <img src="https://lh3.googleusercontent.com/d/1MDOM3X1vnp_hlcoqM4cMliGZgGtHzPdH" alt="Poster ComingSoon SpaceX">
                    <img src="https://lh3.googleusercontent.com/d/17fZybCW8XO4QvgCmfJmEi_XGqTeFfw0x" alt="Kenapa perlu belajar Matematik">
                </div>
                <button class="slider-btn prev">&#10094;</button>
                <button class="slider-btn next">&#10095;</button>
            </div>

            <!-- Latest Announcements -->
            <div class="glass-panel w-full p-6 border-l-4 border-emerald-500">
                <h3 class="text-lg font-bold text-emerald-800 mb-4 flex items-center">
                    <i class="ph ph-megaphone-simple mr-2 text-xl text-emerald-500"></i>Latest Announcements
                </h3>
                <div id="loginAnnouncements" class="flex-1 overflow-y-auto space-y-4 pr-2" style="height: 200px;">
                    <p class="text-sm text-gray-500">Loading teacher announcements...</p>
                </div>
            </div>

        </div>
        
        <!-- RIGHT COLUMN: Login Form Panel -->
        <div class="glass-panel w-full max-w-md p-8 text-center lg:self-stretch flex flex-col justify-center">
            <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-3">
                <img src="https://lh3.googleusercontent.com/d/1Mnzty1gYSdz6EfOmbwp0KbwSh-JmnOOc" alt="Header Image" style="width: 50px; height: auto; display: block; margin: 0 auto -5px auto;">
            </div>
            <h1 class="text-3xl font-bold text-emerald-800 mb-2">GROWPLUS</h1>
            <p class="text-emerald-600 mb-8 text-sm">Version 1.4.3 (5 SEPTEMBER 2026)</p>

            <form id="loginForm" class="space-y-4 text-left">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email / MOE ID</label>
                    <input type="text" id="loginEmail" required class="w-full px-4 py-2 rounded-lg border border-gray-300 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="m-1234567@moe-dl.edu.my">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-2 rounded-lg border border-gray-300 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-green w-full py-3 rounded-lg font-semibold mt-4 shadow-md">Sign In</button>
            </form>
            
            <div class="mt-8 pt-6 border-t border-gray-200">
                <p class="text-sm text-gray-500 mb-3">For Parents & Guardians</p>
                <button onclick="switchView('parent')" class="w-full py-2 bg-white border-2 border-emerald-500 text-emerald-600 rounded-lg font-medium">Parent Dashboard View</button>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-200">
                <p class="text-sm text-gray-500 mb-2">Play Apphub as Guest</p>
                <button onclick="launchPracticeApp('mathSafari')" class="w-full py-2 bg-white border-2 border-emerald-500 text-emerald-600 rounded-lg font-medium">🦁 Arithmetic Math Safari</button>
                <button onclick="launchPracticeApp('roundOffApp')" class="w-full py-2 bg-white border-2 border-emerald-500 text-emerald-600 rounded-lg font-medium">🎯 Rounding Master</button>
                <button onclick="launchPracticeApp('Unit7')" class="w-full py-2 bg-white border-2 border-emerald-500 text-emerald-600 rounded-lg font-medium">7️⃣ Coordinate, Ratio & Proportion</button>   
            
            </div>

        </div>
        
    </div>

    <!-- ==================== PARENT VIEW ==================== -->
    <div id="view-parent" class="hide min-h-screen p-4 md:p-8 bg-gray-50">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-bold text-emerald-800"><i class="ph ph-users-three mr-2"></i>Parent Dashboard</h2>
                <button onclick="exitParentView()" class="text-gray-600 hover:text-emerald-600"><i class="ph ph-sign-out mr-1"></i>Back to Login</button>
            </div>
            
            <div class="glass-panel p-6 mb-8 flex flex-wrap gap-4">
                <input type="text" id="parentIcInput" placeholder="Enter Student IC (e.g., 080101141234)" class="flex-1 px-4 py-2 rounded-lg border border-gray-300 outline-none focus:ring-2 focus:ring-emerald-500">
                <button onclick="searchParent()" id="btnSearchParent" class="btn-green px-6 py-2 rounded-lg font-medium">Search</button>
            </div>

            <div id="parentResults" class="hide space-y-6">
                <!-- Metadata Info Banner -->
                <div class="glass-panel p-6 bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <p class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">Student Profile</p>
                        <h3 id="parentStudentName" class="text-xl font-bold text-emerald-900">-</h3>
                        <p id="parentStudentClass" class="text-sm text-emerald-700 font-medium">Class: -</p>
                    </div>
                    <div class="text-left md:text-right">
                        <p class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">Work Submission Rate</p>
                        <h4 id="parentSubmissionRate" class="text-3xl font-extrabold text-emerald-800">-</h4>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Homework Status -->
                    <div class="glass-panel p-6">
                        <h3 class="text-lg font-semibold mb-4 flex items-center"><i class="ph ph-books mr-2 text-emerald-500"></i>Homework Status</h3>
                        <div id="parentHomework" class="space-y-3 max-h-64 overflow-y-auto pr-2"></div>
                    </div>
                    <!-- Exam Analysis -->
                    <div class="glass-panel p-6">
                        <h3 class="text-lg font-semibold mb-4 flex items-center"><i class="ph ph-exam mr-2 text-emerald-500"></i>Formal Assessment Records</h3>
                        <div id="parentExams" class="space-y-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    // ==================== CONFIGURATION ==================== 
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyPfH3XrCaE3_oGa1UqdlqNpfgn3YFTLxa9917ursl5uGb7RGDJAL3j0_3hqsX03fvcRw/exec";

    // ==================== API BRIDGE ====================
    const api = {
        run: async function(functionName, ...args) {
            const response = await fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    func: functionName, 
                    args: args 
                }),
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                }
            });
            
            const result = await response.json();
            if (result.error) {
                throw new Error(result.error);
            }
            return result.data;
        }
    };

    // ==================== INITIALIZATION ====================
    window.onload = function() { 
        loadAnnouncements(); 
    };

    function switchView(id) {
        document.getElementById('view-login').classList.add('hide');
        document.getElementById('view-parent').classList.add('hide');
        document.getElementById(`view-${id}`).classList.remove('hide');
    }

    // ==================== LOGIN CONTROLLER ====================
    // Handle submission and routing to App.html
       document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        document.getElementById('loader').classList.remove('hide');

        const email = document.getElementById('loginEmail').value.trim();
        const pass = document.getElementById('loginPassword').value.trim();

        try {
            const res = await api.run('loginUser', email, pass);
            if (res.success) {
                localStorage.setItem('loggedInUserEmail', res.user.Email);
                await api.run('logStudentActivity', res.user.Email, 'Login', 'Using github to log in', 0)
                   .catch(err => console.error("Activity logging failed in background:", err));
                window.top.location.href = "Portal.html";

            } else {
                document.getElementById('loader').classList.add('hide');
                Swal.fire('Login Error', res.message, 'error');
            }
        } catch(err) {
            document.getElementById('loader').classList.add('hide');
            await api.run('logStudentActivity', email, 'Login', `Using bitly to log in but ERROR: ${actualError}`, 0);
            Swal.fire('Error', `Connection failed: ${actualError}`, 'error');
        }
    });
        
    // ==================== ANNOUNCEMENTS ====================
    async function loadAnnouncements() {
        try {
            const ann = await api.run('getAnnouncements');
            const container = document.getElementById('loginAnnouncements');
            if (ann && ann.length > 0) {
                container.innerHTML = ann.map(a => `
                    <div class="p-3 bg-emerald-50/50 rounded border border-emerald-100">
                        <span class="text-xs text-emerald-600 font-semibold">${new Date(a.Date).toLocaleDateString()}</span>
                        <p class="text-sm text-gray-700 font-medium whitespace-pre-wrap mt-1">${a.Announcement}</p>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<p class="text-sm text-gray-500 italic">No announcements available.</p>';
            }
        } catch(e) {
            console.error(e);
        }
    }

    // ==================== PARENT MODULE ====================
    function exitParentView() {
        document.getElementById('parentIcInput').value = '';
        document.getElementById('parentStudentName').innerText = '-';
        document.getElementById('parentStudentClass').innerText = 'Class: -';
        document.getElementById('parentSubmissionRate').innerText = '-';
        document.getElementById('parentHomework').innerHTML = '';
        document.getElementById('parentExams').innerHTML = '';
        
        document.getElementById('parentResults').classList.add('hide');
        switchView('login');
    }

    async function searchParent() {
        const ic = document.getElementById('parentIcInput').value.trim();
        if(!ic) return;
        const btn = document.getElementById('btnSearchParent');
        btn.innerText = 'Processing...'; btn.disabled = true;
        
        try {
            const res = await api.run('getParentData', ic);
            if(res.success) {
                document.getElementById('parentResults').classList.remove('hide');
                
                document.getElementById('parentStudentName').innerText = res.student.FullName;
                document.getElementById('parentStudentClass').innerText = `Class: ${res.student.Class || 'N/A'}`;
                
                const emailLower = res.student.Email.trim().toLowerCase();
                
                const targetedAssignments = res.assignments.filter(a => {
                    const targetStr = String(a.AssignedTo || '').trim();
                    if (!targetStr || targetStr.toLowerCase() === 'all') return true;
                    const targetEmails = targetStr.toLowerCase().split(',').map(e => e.trim());
                    return targetEmails.includes(emailLower);
                });
                
                const totalTargeted = targetedAssignments.length;
                const completedSubs = res.submissions.filter(s => s.Submitted === 'Yes');
                const submissionRate = totalTargeted > 0 ? ((completedSubs.length / totalTargeted) * 100).toFixed(1) : 0;
                document.getElementById('parentSubmissionRate').innerText = `${submissionRate}%`;
                
                const hwHtml = targetedAssignments.map(a => {
                    const sub = res.submissions.find(s => String(s.AssignmentId).trim() === String(a.Id).trim());
                    let badgeHtml = '';
                    if (sub) {
                        if (sub.Graded === 'Yes') {
                            badgeHtml = `<span class="px-2 py-1 rounded text-xs font-semibold bg-emerald-100 text-emerald-700">Score: ${sub.Score}/10</span>`;
                        } else {
                            badgeHtml = `<span class="px-2 py-1 rounded text-xs font-semibold bg-yellow-100 text-yellow-700">Pending Grading</span>`;
                        }
                    } else {
                        badgeHtml = `<span class="px-2 py-1 rounded text-xs font-semibold bg-red-100 text-red-700">Unsubmitted</span>`;
                    }
                    
                    return `
                        <div class="flex justify-between items-center text-sm border-b border-gray-100 pb-2">
                            <span class="font-medium text-gray-700">${a.Title}</span>
                            ${badgeHtml}
                        </div>
                    `;
                }).join('');
                document.getElementById('parentHomework').innerHTML = hwHtml || '<p class="text-sm text-gray-400 italic">No tasks found.</p>';
                
                const exHtml = res.exams.map(e => {
                        // 1. Declare nameLower inside the loop for each exam object
                        const nameLower = String(e.ExamName || '').toLowerCase();
                        
                        // 2. Perform the double condition check
                        const isMidTerm2026 = nameLower.includes('mid') && nameLower.includes('2026');

                        // 3. Set badge color
                        let badgeClass = 'bg-gray-100 text-gray-700 border-gray-300';
                        if (e.Grade === 'E') badgeClass = 'bg-orange-100 text-orange-700 border-orange-200';
                        if (e.Grade === 'F') badgeClass = 'bg-red-100 text-red-700 border-red-200';
                        if (e.Grade === 'A' || e.Grade === 'B' || e.Grade === 'C' || e.Grade === 'D') badgeClass = 'bg-emerald-100 text-emerald-700 border-emerald-200';

                        return `
                            <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg border border-gray-100">
                                <span class="font-medium text-gray-700">${e.ExamName}</span>
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-gray-900">${e.Score}%</span>
                                    <span class="text-xs font-bold px-2 py-1 border rounded-md ${badgeClass}">Grade ${e.Grade}</span>
                                    
                                    ${isMidTerm2026 ? `
                                        <button onclick="goToExamDashboard('${ic}')" 
                                            class="ml-1 px-3 py-1 bg-pink-600 hover:bg-pink-700 text-white rounded-md text-xs font-bold shadow-sm transition flex items-center gap-1">
                                            <i class="ph ph-chart-bar"></i> Analyze
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    }).join('');
                
                document.getElementById('parentExams').innerHTML = exHtml || '<p class="text-sm text-gray-400 italic">No exam entries.</p>';
            } else {
                Swal.fire('No student found', res.message, 'warning');
            }
        } catch(e) { console.error(e); }
        btn.innerText = 'Search'; btn.disabled = false;
    }
    
    function goToExamDashboard(icNumber) {
            if (!icNumber) {
                alert("IC Number missing.");
                return;
            }

            // Automatically grabs the current GAS web app base URL (/exec)
            const baseUrl = "https://script.google.com/macros/s/AKfycbxyBrdGP1ghVf0nPG3gyXgle4BAxmRy8UTTwrUlkTacvEJ-SG2l4W42b9IZMdiCx6rHhw/exec"
            
            // Builds the full URL targeting page=exam and appending the pupil IC
            const finalUrl = `${baseUrl}?page=MidTerm2026&ic=${encodeURIComponent(icNumber)}`;
            
            // Opens the exam analysis dashboard in a new browser tab
            window.open(finalUrl, "_blank");
    }
    
        // For image slider
        const sliderContainer = document.querySelector('.embedded-slider');
        const track = sliderContainer.querySelector('.slider-track');
        const slides = sliderContainer.querySelectorAll('.slider-track img');
        const prevBtn = sliderContainer.querySelector('.slider-btn.prev');
        const nextBtn = sliderContainer.querySelector('.slider-btn.next');

        let currentIndex = 0;
        let autoSlideInterval;

        function updateSlider() {
          track.style.transform = `translateX(-${currentIndex * 100}%)`;
        }

        function nextSlide() {
          currentIndex = (currentIndex + 1) % slides.length;
          updateSlider();
        }

        function prevSlide() {
          currentIndex = (currentIndex - 1 + slides.length) % slides.length;
          updateSlider();
        }

        // Starts or resets the 5-second (5000ms) timer
        function startAutoSlide() {
          clearInterval(autoSlideInterval);
          autoSlideInterval = setInterval(nextSlide, 5000);
        }

        // Button controls
        nextBtn.addEventListener('click', () => {
          nextSlide();
          startAutoSlide(); // Resets timer so it doesn't jump immediately after clicking
        });

        prevBtn.addEventListener('click', () => {
          prevSlide();
          startAutoSlide(); // Resets timer on click
        });

        // Pause auto-sliding when user hovers over the slider
        sliderContainer.addEventListener('mouseenter', () => clearInterval(autoSlideInterval));
        sliderContainer.addEventListener('mouseleave', startAutoSlide);

        // Start auto-sliding on load
        startAutoSlide();

        // For Guest to launch AppHub
        async function launchPracticeApp(appKey) {
            if (appKey === 'mathSafari') {
                try {
                    // 1. Dynamically retrieve the absolute Web App deployment URL
                    const baseUrl = await api.run('getWebAppUrl');
                    
                    // 2. Append the target page parameter flag pointing to MathGame.html
                    const targetGameUrl = baseUrl + "?page=game";
                    
                    // 3. Perform a safe top-frame redirect out of the sandbox
                    if (window.top && window.top.location) {
                        window.top.location.href = targetGameUrl;
                    } else {
                        window.location.href = targetGameUrl;
                    }
                    api.run('logStudentActivity', 'Guest', 'Enter to Arithmetic Math Safari', '' , '0' );
                } catch (err) {
                    console.error("Failed to route to game page container safely:", err);
                    
                    // Fallback backup route assignment in case the promise encounters an absolute break
                    const fallbackUrl = "https://script.google.com/macros/s/AKfycbxyBrdGP1ghVf0nPG3gyXgle4BAxmRy8UTTwrUlkTacvEJ-SG2l4W42b9IZMdiCx6rHhw/exec?page=game";
                    if (window.top && window.top.location) {
                        window.top.location.href = fallbackUrl;
                    } else {
                        window.location.href = fallbackUrl;
                    }
                }
            }
            if (appKey === 'roundOffApp') {
                try {
                    // 1. Dynamically retrieve the absolute Web App deployment URL
                    const baseUrl = await api.run('getWebAppUrl');
                    
                    // 2. Append the target page parameter flag pointing to MathGame.html
                    const targetGameUrl = baseUrl + "?page=roundOff";
                    
                    // 3. Perform a safe top-frame redirect out of the sandbox
                    if (window.top && window.top.location) {
                        window.top.location.href = targetGameUrl;
                    } else {
                        window.location.href = targetGameUrl;
                    }
                    api.run('logStudentActivity', 'Guest', 'Enter to Rounding Master', '' , '0' );
                } catch (err) {
                    console.error("Failed to route to game page container safely:", err);
                    
                    // Fallback backup route assignment in case the promise encounters an absolute break
                    const fallbackUrl = "https://script.google.com/macros/s/AKfycbxyBrdGP1ghVf0nPG3gyXgle4BAxmRy8UTTwrUlkTacvEJ-SG2l4W42b9IZMdiCx6rHhw/exec?page=roundOff";
                    if (window.top && window.top.location) {
                        window.top.location.href = fallbackUrl;
                    } else {
                        window.location.href = fallbackUrl;
                    }
                }
            }
            if (appKey === 'Unit7') {
                try {
                    // 1. Dynamically retrieve the absolute Web App deployment URL
                    const baseUrl = await api.run('getWebAppUrl');
                    
                    // 2. Append the target page parameter flag pointing to MathGame.html
                    const targetGameUrl = baseUrl + "?page=Unit7";
                    
                    // 3. Perform a safe top-frame redirect out of the sandbox
                    if (window.top && window.top.location) {
                        window.top.location.href = targetGameUrl;
                    } else {
                        window.location.href = targetGameUrl;
                    }
                    api.run('logStudentActivity', 'Guest', 'Enter to Unit 7', '' , '0' );
                } catch (err) {
                    console.error("Failed to route to game page container safely:", err);
                    
                    // Fallback backup route assignment in case the promise encounters an absolute break
                    const fallbackUrl = "https://script.google.com/macros/s/AKfycbxyBrdGP1ghVf0nPG3gyXgle4BAxmRy8UTTwrUlkTacvEJ-SG2l4W42b9IZMdiCx6rHhw/exec?page=Unit7";
                    if (window.top && window.top.location) {
                        window.top.location.href = fallbackUrl;
                    } else {
                        window.location.href = fallbackUrl;
                    }
                }
            }
        }
</script>
</body>
</html>
